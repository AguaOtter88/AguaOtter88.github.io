<!DOCTYPE html>
<html lang="zh_TW">

<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>個人主頁</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>

<body>

  <!-- 主頁面外層包覆：確保相對定位正確 -->
  <div class="profile-container">

    <!-- 1. 背景輪播圖 (Banner) -->
    <!-- 加上 data-bs-touch="true" 確保手機端啟用手勢觸控滑動 -->
    <div class="swiper banner-swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="css/img1.jpg" class="d-block w-100 banner-img" style="object-position: 50% 30%;" alt="...">
        </div>
        <div class="swiper-slide">
          <img src="css/img2.jpg" class="d-block w-100 banner-img" style="object-position: 50% 0%;" alt="...">
        </div>
        <div class="swiper-slide">
          <img src="css/img3.jpg" class="d-block w-100 banner-img" style="object-position: 50% 10%;" alt="...">
        </div>
      </div>
    </div>
    <!-- 2. 個人資訊區塊 -->
    <!-- 個人資訊區塊 -->
    <div class="container pb-4 px-4 position-relative">
      <!-- 1. 最外層 Profile Header -->
      <div
        class="profile-header d-flex flex-column d-md-flex flex-md-row align-items-center align-items-md-end text-center text-md-start">

        <!-- 2. 大頭貼 -->
        <div class="avatar-box flex-shrink-0">
          <img src="css/title.jpg" class="rounded-circle img-thumbnail bg-dark border-secondary avatar-img" alt="大頭貼">
        </div>

        <div class="w-100 mt-3 mt-md-0 ps-md-4">
          <div class="row g-3 align-items-start">
            <div class="col-12 col-md-6">
              <h2 class="fw-bold mb-1 fs-3">🌮獺克</h2>
              <p class="text-secondary small mb-3 mb-md-2">塔克或是隨便拉...</p>

              <div class="text-center text-md-start">
                <ul class="list-unstyled mb-0 small text-start d-inline-block profile-list text-nowrap">
                  <li class="mb-1">💖 水獺｜粉紅色的水獺雪貂</li>
                  <li class="mb-1">🍖 喜歡｜燒烤、牛排、鍋物</li>
                  <li class="mb-1">🔮 興趣｜動漫、電影、電玩</li>
                </ul>
              </div>
            </div>

            <!-- 【右欄】：長內文區塊 -->
            <div class="col-12 col-md-6">
              <ul class="list-unstyled mb-0 small text-start d-inline-block profile-list">
                <li class="mb-1 text-truncate">很長的內文很長的內文很長的內文</li>
                <li class="mb-1 text-truncate">很長的內文很長的內文很長的內文</li>
                <li class="mb-1 text-truncate">很長的內文很長的內文很長的內文</li>
                <li class="mb-1 text-truncate">很長的內文很長的內文很長的內文</li>
                <li class="mb-1 text-truncate">很長的內文很長的內文很長的內文</li>
                <li class="mb-1 text-truncate">很長的內文很長的內文很長的內文</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="footer-section py-4">
    <div class="container px-4">
      <div class="row align-items-center gy-3">

        <!-- 左側：版權宣告與 Powered by Bootstrap (補上 col-12 col-lg-6，統一 lg 斷點) -->
        <div class="col-12 col-lg-6 text-center text-lg-start">
          <div
            class="text-secondary small d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start gap-2">
            <span>&copy; 2026 All Rights Reserved.</span>
            <span class="text-secondary-50">|</span>
            <span>Powered by <a href="https://getbootstrap.com/" target="_blank" rel="noopener noreferrer"
                class="footer-link text-decoration-underline">Bootstrap</a></span>
          </div>
        </div>

        <!-- 右側：Linktree 社群按鈕 -->
        <div class="col-12 col-lg-6 text-center text-lg-end">
          <div class="d-flex flex-wrap gap-2 justify-content-center justify-content-lg-end">

            <a href="https://facebook.com/AguaOtter88" target="_blank" rel="noopener noreferrer"
              class="btn btn-outline-light btn-sm rounded-pill px-3 shadow-sm">
              📘 Facebook
            </a>
            <a href="https://x.com/GuYueH_AD" target="_blank" rel="noopener noreferrer"
              class="text-secondary text-decoration-none small opacity-75 link-light">
              X
            </a>
          </div>
        </div>

      </div>
    </div>
  </footer>
</body>
<script>
  const bannerSwiper = new Swiper('.banner-swiper', {
    loop: true,                 /* 循環播放 */
    grabCursor: true,           /* 電腦版滑鼠移上去時顯示抓取手勢 icon */
    autoplay: {
      delay: 4000,              /* 每 4 秒自動切換 */
      disableOnInteraction: false, /* 使用者手動拖曳後，依然保持自動輪播 */
    },
    speed: 600,                 /* 滑動過渡時間 (ms) */
  });
</script>
<style>
  body {
    background-color: #1E1E1E;
    margin: 0;
    color: #F7F7F7;
    font-family: "Microsoft JhengHei", sans-serif;
  }

  /* 確保父層有正確的相對定位與背景 */
  .profile-container {
    position: relative;
    background-color: #212529;
    /* 貼近原本 bg-dark 的顏色 */
  }

  /* 輪播圖 RWD 高度控制：移除寫死的 1400px 寬度 */
  .banner-img {
    width: 100%;
    height: 250px;
    /* 手機版橫幅高度 */
    object-fit: cover;
  }

  /* 大頭貼樣式控制 */
  .avatar-img {
    width: 200px;
    /* 手機版大頭貼大小 */
    height: 200px;
    object-fit: cover;
    border-width: 4px !important;
  }

  /* 核心 RWD 區塊：利用負邊距向上重疊 */
  .profile-header {
    margin-top: -80px;
    /* 手機版：向上移動大頭貼直徑的一半 (160/2)，達成正中央切線 */
    position: relative;
    z-index: 10;
  }

  .profile-list {
    color: #e4e6eb;
    font-size: 0.9rem;
  }

  /* ----------------------------------------- */
  /* 電腦版樣式微調（螢幕寬度 768px 以上） */
  /* ----------------------------------------- */
  @media (min-width: 768px) {
    .banner-img {
      height: 480px;
      /* 還原你原本想要的電腦版橫幅高度 */
    }

    .avatar-img {
      width: 250px;
      /* 電腦版大頭貼大小（與你原截圖比例一致） */
      height: 250px;
    }

    .profile-header {
      margin-top: -40px;
      /* 電腦版：依照第二張截圖，只微微往上切入 Banner */
    }
  }
</style>

</html>
